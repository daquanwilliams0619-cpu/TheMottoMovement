<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .bg { fill: #f3eadf; }
      .ball { fill: #dd6b1f; stroke: #0b2433; stroke-width:40; }
      .line { fill: none; stroke: #0b2433; stroke-width:32; stroke-linecap:round; }
      .title { font-family: 'Arial Black', Arial, sans-serif; font-weight:900; fill:#0b2433; font-size:110px; letter-spacing:6px }
    </style>
  </defs>
  <rect class="bg" width="1024" height="1024" rx="0"/>
  <!-- Basketball -->
  <g transform="translate(512,420)">
    <circle class="ball" r="300"/>
    <path class="line" d="M-300,-20 A300,300 0 0,0 300,20" />
    <path class="line" d="M-220,-260 A300,300 0 0,0 220,260" transform="rotate(20)" />
    <path class="line" d="M-220,260 A300,300 0 0,0 220,-260" transform="rotate(-20)" />
    <path class="line" d="M-300,0 L300,0" />
  </g>
  <!-- Text -->
  <text class="title" x="512" y="130" text-anchor="middle">MOTTO</text>
  <text class="title" x="512" y="980" text-anchor="middle" transform="translate(0,-20)">MOVEMENT</text>
</svg>
